<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Favourites</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{--ac:#f2b134;--ff:"Iowan Old Style","Palatino Linotype",Georgia,serif;--line:#ffffff1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#f1ece2;font:16px/1.5 system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:680px;margin:0 auto;padding:0 16px 110px;min-height:100vh}
h1,h2,h3{font-family:var(--ff);font-weight:700;letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;background:var(--ac);color:#000;cursor:pointer;transition:transform .15s,opacity .15s}
button.g{background:#ffffff1c;color:#f1ece2}button:active,.fc:active,.row:active,.links a:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;margin:0 -16px 16px;padding:14px 16px;background:#000a;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
header.top h1{font-size:1.5rem;white-space:nowrap}header.top:focus-within h1{display:none}
input,select,textarea{width:100%;font:inherit;color:inherit;background:#ffffff12;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:6px}
header.top input{flex:1;min-width:0;margin:0;border-radius:999px;-webkit-appearance:none;appearance:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input::placeholder{color:#f1ece28c}select option{background:#1b1b1b}input[type=color]{height:44px;padding:3px}input[type=range]{padding:0;accent-color:var(--ac)}
.fl{width:44px;height:44px;padding:0;border-radius:50%;background:#ffffff1c;color:#f1ece2;font-size:1.2rem;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bar{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;max-width:680px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;z-index:9}
.bar .fl:last-child:not(:first-child){width:auto;padding:0 18px;border-radius:999px;font-size:1rem}
.list{display:grid;gap:14px}.list h3{margin-top:10px;font-size:1.2rem}
.empty{opacity:.65;padding:8px 0}
.fc{position:relative;display:block;border-radius:24px;overflow:hidden;background:var(--cc,#141414);transition:transform .2s}
.fc .img{aspect-ratio:3/2;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.fc .tx{position:relative;margin-top:-38px;padding:0 22px 22px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fc:not(:has(.img)) .tx{margin:0;padding:26px 22px}
.fc b{font:700 1.9rem/1.1 var(--ff);letter-spacing:-.02em;text-shadow:0 2px 12px #0006}.fc span{font-size:.9rem;opacity:.85;white-space:nowrap}
.row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:var(--tbg,#141414);color:var(--tfg,#f1ece2);font-family:var(--tff,inherit);transition:transform .2s}
.row img,.row .ph{width:56px;height:84px;border-radius:12px;object-fit:cover;flex:none}.row .ph{display:grid;place-items:center;background:#ffffff1a;font:700 1.6rem var(--ff)}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:1.1rem;line-height:1.25}.rt small{opacity:.7}
.sc{font:700 1.7rem var(--ff);color:var(--tac,var(--ac));padding-right:6px}
.hero{position:relative;margin:0 -16px 18px;overflow:hidden;background:var(--cc)}
.hero .img{aspect-ratio:4/3;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.hero:not(:has(.img)){padding-top:90px}.ht{position:relative;padding:0 20px 14px;margin-top:-44px}.hero:not(:has(.img)) .ht{margin:0}
.ht h1{font-size:2.4rem;line-height:1.05}.ht p{margin:6px 0 0;opacity:.8}
.tp{padding-top:72px}.tp h1{font-size:2.3rem;line-height:1.1}.tp h3{margin:26px 0 8px}
.big{width:min(240px,64%);aspect-ratio:2/3;object-fit:cover;border-radius:20px;display:block;margin-bottom:18px}
.meta{opacity:.7;margin:6px 0 0}.score{font:700 3.4rem/1 var(--ff);color:var(--ac);margin:16px 0}.score small{font:400 1rem system-ui;opacity:.7}
.notes{white-space:pre-wrap;max-width:60ch}.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:16px;background:#ffffff14;color:var(--ac);word-break:break-all;transition:transform .15s}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));padding:15px 24px;box-shadow:0 8px 30px #000c;z-index:8}
.scrim{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#161616;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.25,1)}
.grab{width:42px;height:5px;border-radius:9px;background:#ffffff40;margin:0 auto 14px}.sheet h2{font-size:1.5rem;margin-bottom:6px}
label{display:block;margin-top:14px;font-size:.9rem;opacity:.9}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:10px}.chk input{width:auto;margin:0}
.pv{display:flex;align-items:flex-end;gap:12px;margin-top:10px}.pv img{width:80px;border-radius:12px}
.acts{display:flex;gap:8px;margin-top:22px;align-items:center}.acts span:empty{flex:1}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.boot .fc,.boot .row{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
::view-transition-old(root){animation:.16s ease both fade reverse}
::view-transition-new(root){animation:.3s cubic-bezier(.2,.8,.2,1) both rise}
@media(prefers-reduced-motion:reduce){*,::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}}
.gz{padding:4px 0 10px;touch-action:none}.gz .grab{margin:0 auto}
.ring{position:relative;width:136px;height:136px;margin:20px 0}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#ffffff1f;stroke-width:6}.ring .v{stroke:var(--ac);stroke-linecap:round;animation:draw .9s cubic-bezier(.2,.8,.2,1) .15s both}
.ring .score{position:absolute;inset:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.6rem;line-height:1}.ring .score small{font-size:.75rem;margin-top:4px}
@keyframes draw{from{stroke-dasharray:0 276.5}}
